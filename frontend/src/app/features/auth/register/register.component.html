<div class="relative min-h-screen flex items-center justify-center p-6 overflow-hidden">
  <om-aurora class="absolute inset-0 -z-10"></om-aurora>
  <app-card class="relative w-full max-w-[420px]">
    <div class="flex items-center gap-2.5 mb-1">
      <span class="w-[22px] h-[22px] rounded-full border-[5px] border-accent shadow-[inset_0_0_0_2px_var(--color-bg)]"></span>
      <h1 class="text-2xl font-display m-0">IRON<span class="text-accent">LOG</span></h1>
    </div>
    <p class="text-text-dim mb-6">Create an account to start tracking sessions.</p>

    <form (ngSubmit)="submit()">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5 mb-4 min-w-0">
          <label class="text-xs uppercase tracking-wide text-text-faint font-semibold" for="firstName">First name</label>
          <input
            id="firstName" name="firstName" [(ngModel)]="firstName" required
            class="bg-bg border border-border-light rounded-md px-3 py-2.5 text-text w-full min-w-0 focus:border-accent focus:outline-none"
          />
        </div>
        <div class="flex flex-col gap-1.5 mb-4 min-w-0">
          <label class="text-xs uppercase tracking-wide text-text-faint font-semibold" for="lastName">Last name</label>
          <input
            id="lastName" name="lastName" [(ngModel)]="lastName" required
            class="bg-bg border border-border-light rounded-md px-3 py-2.5 text-text w-full min-w-0 focus:border-accent focus:outline-none"
          />
        </div>
      </div>
      <div class="flex flex-col gap-1.5 mb-4 min-w-0">
        <label class="text-xs uppercase tracking-wide text-text-faint font-semibold" for="email">Email</label>
        <input
          id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="email"
          class="bg-bg border border-border-light rounded-md px-3 py-2.5 text-text w-full min-w-0 focus:border-accent focus:outline-none"
        />
      </div>
      <div class="flex flex-col gap-1.5 mb-4 min-w-0">
        <label class="text-xs uppercase tracking-wide text-text-faint font-semibold" for="password">Password</label>
        <input
          id="password" type="password" name="password" [(ngModel)]="password" required autocomplete="new-password"
          class="bg-bg border border-border-light rounded-md px-3 py-2.5 text-text w-full min-w-0 focus:border-accent focus:outline-none"
        />
        <span class="text-xs text-text-faint">At least 8 characters.</span>
      </div>

      @if (error()) {
        <p class="text-danger text-sm mt-1 mb-2">{{ error() }}</p>
      }

      <button appButton variant="primary" type="submit" [disabled]="loading()" class="w-full mt-2">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="mt-5 text-center text-[0.88rem]">Already training with us? <a routerLink="/login">Sign in</a></p>
  </app-card>
</div>
