<div class="max-w-[900px] mx-auto px-7 pt-8 pb-16">
  <header class="flex items-end justify-between mb-6 flex-wrap gap-4">
    <div>
      <p class="uppercase tracking-wide text-xs text-text-faint mb-1">History</p>
      <h1 class="text-[1.9rem] m-0">Workouts</h1>
    </div>
    <div class="flex gap-2.5 max-[700px]:flex-col max-[700px]:items-stretch">
      <input [(ngModel)]="quickName" placeholder="Session name, e.g. Leg day" name="quickName"
             class="bg-surface border border-border-light rounded-md px-3 py-2.5 text-text min-w-[200px]" />
      <button appButton variant="primary" (click)="startBlank()">+ Start blank workout</button>
    </div>
  </header>

  @if (loading()) {
    <p class="text-center py-12 px-4 text-text-faint">Loading history…</p>
  } @else if (sessions().length === 0) {
    <p class="text-center py-12 px-4 text-text-faint">No workouts logged yet. Start one above, or launch from a template.</p>
  } @else {
    <div class="flex flex-col gap-3">
      @for (s of sessions(); track s.id) {
        <button
          (click)="open(s)"
          class="appearance-none block w-full text-left border border-border bg-surface rounded-2xl p-6 cursor-pointer font-[inherit] text-inherit
                 shadow-[0_1px_0_rgba(255,255,255,0.03)_inset,0_8px_24px_rgba(0,0,0,0.35)]
                 hover:border-border-light hover:bg-surface-hover
                 flex items-center justify-between max-[700px]:flex-col max-[700px]:items-start max-[700px]:gap-2"
        >
          <div class="flex flex-col gap-1">
            <h3 class="text-[1.05rem] m-0">{{ s.name }}</h3>
            <span class="text-text-faint text-[0.82rem]">{{ s.startedAt | date: 'MMM d, y · h:mm a' }} @if (s.templateName) { · {{ s.templateName }} }</span>
          </div>
          <div class="flex items-center gap-3.5">
            <app-badge [variant]="s.completedAt ? 'accent' : 'default'">{{ s.completedAt ? 'Completed' : 'In progress' }}</app-badge>
            <span class="font-mono text-text-dim text-[0.85rem]">{{ s.sets.length }} sets</span>
          </div>
        </button>
      }
    </div>
  }
</div>
