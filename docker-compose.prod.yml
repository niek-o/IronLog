services:
  db:
    image: postgres:17-alpine
    container_name: fitness-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fitnesstracker}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fitnesstracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/FitnessTracker.Api
    container_name: fitness-tracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=${POSTGRES_DB:-fitnesstracker};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      JWT_KEY: "${JWT_KEY:?JWT_KEY must be set in .env, e.g. via openssl rand -base64 48}"
      Cors__AllowedOrigins: "https://ironlog.niek.io"
      ASPNETCORE_ENVIRONMENT: Production
      EnableSwagger: "${ENABLE_SWAGGER:-false}"

  frontend:
    build:
      context: ./frontend
    container_name: ironlog.niek.io
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ironlog.rule=Host(`ironlog.niek.io`)"
      - "traefik.http.routers.ironlog.entrypoints=web,websecure"
      - "traefik.http.routers.ironlog.tls=true"
      - "traefik.http.routers.ironlog.tls.certresolver=cloudflare"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.ironlog.loadbalancer.server.port=80"
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
  default:

volumes:
  db-data:
