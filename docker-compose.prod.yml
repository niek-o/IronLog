services:
  db:
    image: postgres:17-alpine
    container_name: fitness-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fitnesstracker}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fitnesstracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/FitnessTracker.Api
    container_name: fitness-tracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=${POSTGRES_DB:-fitnesstracker};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      JWT_KEY: "${JWT_KEY:?JWT_KEY must be set in .env, e.g. via openssl rand -base64 48}"
      Cors__AllowedOrigins: "https://${DOMAIN:?DOMAIN must be set in .env}"
      ASPNETCORE_ENVIRONMENT: Production
      EnableSwagger: "${ENABLE_SWAGGER:-false}"

  frontend:
    build:
      context: ./frontend
    container_name: fitness-tracker-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.ironlog.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ironlog.entrypoints=websecure
      - traefik.http.routers.ironlog.tls=true
      - traefik.http.routers.ironlog.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.ironlog.loadbalancer.server.port=80
      - traefik.http.routers.ironlog-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ironlog-http.entrypoints=web
      - traefik.http.routers.ironlog-http.middlewares=ironlog-https-redirect
      - traefik.http.middlewares.ironlog-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.ironlog-https-redirect.redirectscheme.permanent=true

networks:
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
  default:

volumes:
  db-data:
