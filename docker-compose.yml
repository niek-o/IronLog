services:
  db:
    image: postgres:17-alpine
    container_name: fitness-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnesstracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fitnesstracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/FitnessTracker.Api
    container_name: fitness-tracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=${POSTGRES_DB:-fitnesstracker};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      JWT_KEY: ${JWT_KEY:-dev-only-change-this-secret-key-before-deploying-1234567890}
      Cors__AllowedOrigins: "http://localhost:4200,http://localhost:8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      EnableSwagger: "true"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
    container_name: fitness-tracker-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:
